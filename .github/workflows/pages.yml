name: Build and Release Psych Engine HTML Port

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: psych-engine-html-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout web port configuration
        uses: actions/checkout@v4

      - name: Download Psych Engine 0.7.3 source
        run: git clone --depth 1 --branch 0.7.3 https://github.com/ShadowMario/FNF-PsychEngine.git engine

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: "4.2.5"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev libgl1-mesa-dev zip
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install Haxe libraries
        working-directory: engine
        run: |
          haxelib install lime 8.1.2 --quiet
          haxelib run lime setup -y
          haxelib install openfl 9.3.3 --quiet
          haxelib install flixel 5.6.1 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install flixel-addons 3.2.2 --quiet
          haxelib install flixel-tools 1.5.1 --quiet
          haxelib install tjson 1.4.0 --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate dev

      - name: Patch native file access for browser builds
        working-directory: engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = Path("source/backend/Paths.hx")
          s = paths.read_text()
          for old, new in [
              ("spriteJson = File.getContent(spriteJson);",
               "#if sys\n\t\t\tspriteJson = File.getContent(spriteJson);\n\t\t\t#else\n\t\t\tspriteJson = Assets.getText(spriteJson);\n\t\t\t#end"),
              ("animationJson = File.getContent(animationJson);",
               "#if sys\n\t\t\tanimationJson = File.getContent(animationJson);\n\t\t\t#else\n\t\t\tanimationJson = Assets.getText(animationJson);\n\t\t\t#end"),
          ]:
              if old not in s:
                  raise SystemExit(f"Expected Paths.hx pattern not found: {old}")
              s = s.replace(old, new, 1)
          paths.write_text(s)

          animate = Path.home() / "haxelib/flxanimate/git/flxanimate/FlxAnimate.hx"
          s = animate.read_text()
          old = "if(trimmed == '.json') myJson = sys.io.File.getContent(myJson); //is a path"
          new = """if(trimmed == '.json')
          {
          #if sys
              myJson = sys.io.File.getContent(myJson);
          #else
              myJson = openfl.Assets.getText(myJson);
          #end
          }"""
          if old not in s:
              raise SystemExit("Expected FlxAnimate.hx JSON pattern not found")
          s = s.replace(old, new, 1)
          old = "myData = sys.io.File.getContent(pathOrStr);"
          new = """#if sys
              myData = sys.io.File.getContent(pathOrStr);
          #else
              myData = openfl.Assets.getText(pathOrStr);
          #end"""
          if s.count(old) < 2:
              raise SystemExit("Expected FlxAnimate.hx file-read patterns not found")
          s = s.replace(old, new)
          animate.write_text(s)

          # Avoid resolving flixel.addons.ui.Option instead of Psych Engine's options.Option.
          for name in ["GraphicsSettingsSubState.hx", "VisualsUISubState.hx", "GameplaySettingsSubState.hx"]:
              p = Path("source/options") / name
              s = p.read_text()
              s = s.replace("var option:Option", "var option:options.Option")
              s = s.replace("new Option(", "new options.Option(")
              p.write_text(s)

          # The character editor's filesystem directory scan is not available in HTML5.
          p = Path("source/states/editors/CharacterEditorState.hx")
          s = p.read_text()
          old = """\t\tvar foldersToCheck:Array<String> = Mods.directoriesWithFile(Paths.getSharedPath(), 'characters/');
          \t\tfor (folder in foldersToCheck)
          \t\t\tfor (file in FileSystem.readDirectory(folder))
          \t\t\t\tif(file.toLowerCase().endsWith('.json'))
          \t\t\t\t{
          \t\t\t\t\tvar charToCheck:String = file.substr(0, file.length - 5);
          \t\t\t\t\tif(!characterList.contains(charToCheck))
          \t\t\t\t\t\tcharacterList.push(charToCheck);
          \t\t\t\t}"""
          new = """\t\t#if sys
          \t\tvar foldersToCheck:Array<String> = Mods.directoriesWithFile(Paths.getSharedPath(), 'characters/');
          \t\tfor (folder in foldersToCheck)
          \t\t\tfor (file in FileSystem.readDirectory(folder))
          \t\t\t\tif(file.toLowerCase().endsWith('.json'))
          \t\t\t\t{
          \t\t\t\t\tvar charToCheck:String = file.substr(0, file.length - 5);
          \t\t\t\t\tif(!characterList.contains(charToCheck))
          \t\t\t\t\t\tcharacterList.push(charToCheck);
          \t\t\t\t}
          \t\t#end"""
          if old not in s:
              raise SystemExit("Expected CharacterEditorState directory scan not found")
          p.write_text(s.replace(old, new, 1))

          # FlxG.error was removed from the selected Flixel version.
          p = Path("source/backend/CoolUtil.hx")
          s = p.read_text()
          if 'FlxG.error("Platform is not supported for CoolUtil.openFolder");' not in s:
              raise SystemExit("Expected CoolUtil FlxG.error call not found")
          p.write_text(s.replace('FlxG.error("Platform is not supported for CoolUtil.openFolder");',
                                 'trace("Platform is not supported for CoolUtil.openFolder");', 1))

          # OpenFL no longer exposes ImageCanvasUtil / __srcContext to this renderer.
          renderer = Path.home() / "haxelib/flxanimate/git/flxanimate/display/FlxAnimateFilterRenderer.hx"
          s = renderer.read_text()
          start = s.find("public function applyBlend(")
          end = s.find("public function graphicstoBitmapData", start)
          method = """public function applyBlend(blend:BlendMode, bitmap:BitmapData)
          {
          \t#if (js && html5)
          \tvar bmp = new BitmapData(bitmap.width, bitmap.height, true, 0);
          \t// Browser fallback: avoid private canvas internals unavailable in OpenFL.
          \tbmp.draw(bitmap);
          \treturn bmp;
          \t#else
          \tvar bmp = new BitmapData(bitmap.width, bitmap.height, 0);
          \tvar renderer = new CairoRenderer(new Cairo(bmp.getSurface()));
          \tsetRenderer(renderer, bmp.rect);
          \trenderer.__setBlendMode(blend);
          \tbmp.__drawCairo(bitmap, renderer);
          \treturn bmp;
          \t#end
          }
          
          """
          if start < 0 or end < 0:
              raise SystemExit("Expected FlxAnimateFilterRenderer.applyBlend method boundaries not found")
          s = s[:start] + method + s[end:]
          renderer.write_text(s)

          project = Path("Project.xml")
          s = project.read_text()
          s = s.replace('<define name="DISCORD_ALLOWED" />', '<define name="DISCORD_ALLOWED" if="desktop" />')
          project.write_text(s)
          PY

      - name: Build HTML5
        working-directory: engine
        run: haxelib run lime build html5 -final

      - name: Package as a single self-contained HTML
        run: |
          set -euo pipefail
          mkdir -p release
          HTML=$(find engine/export -type f -name index.html -print -quit)
          if [ -z "$HTML" ]; then
            echo "Build did not produce index.html; refusing to publish a fake release." >&2
            exit 1
          fi
          ROOT=$(dirname "$HTML")
          python3 - "$ROOT" "$GITHUB_WORKSPACE/release/PsychEngineWebPort.html" <<'PY'
          import base64, json, mimetypes, re, sys
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path(sys.argv[1]).resolve()
          output = Path(sys.argv[2])
          html_path = root / "index.html"
          html = html_path.read_text(encoding="utf-8")

          def mime(path):
              guessed = mimetypes.guess_type(str(path))[0]
              if guessed:
                  return guessed
              if path.suffix.lower() == ".wasm":
                  return "application/wasm"
              if path.suffix.lower() == ".json":
                  return "application/json"
              return "application/octet-stream"

          files = {}
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path == html_path:
                  continue
              rel = path.relative_to(root).as_posix()
              data = base64.b64encode(path.read_bytes()).decode("ascii")
              files[rel] = f"data:{mime(path)};base64,{data}"

          if not files:
              raise SystemExit("No runtime files found beside index.html; refusing to create an incomplete single-file build.")

          def inline_script(match):
              attrs = match.group(1)
              src_match = re.search(r'\bsrc\s*=\s*["\']([^"\']+)["\']', attrs, re.I)
              if not src_match:
                  return match.group(0)
              src = unquote(urlsplit(src_match.group(1)).path).lstrip("./")
              candidate = (root / src).resolve()
              if root not in candidate.parents or not candidate.is_file() or candidate.suffix.lower() != ".js":
                  return match.group(0)
              code = candidate.read_text(encoding="utf-8")
              code = re.sub(r"</script", r"<\/script", code, flags=re.I)
              attrs = re.sub(r'\s+src\s*=\s*["\'][^"\']+["\']', "", attrs, flags=re.I)
              return "<script" + attrs + ">\n" + code + "\n</script>"

          html = re.sub(r"<script\b([^>]*)>\s*</script>", inline_script, html, flags=re.I)

          def inline_style(match):
              attrs = match.group(1)
              href_match = re.search(r'\bhref\s*=\s*["\']([^"\']+\.css(?:\?[^"\']*)?)["\']', attrs, re.I)
              if not href_match:
                  return match.group(0)
              href = unquote(urlsplit(href_match.group(1)).path).lstrip("./")
              candidate = (root / href).resolve()
              if root not in candidate.parents or not candidate.is_file():
                  return match.group(0)
              css = candidate.read_text(encoding="utf-8")
              css = re.sub(r"</style", r"<\/style", css, flags=re.I)
              return "<style>\n" + css + "\n</style>"

          html = re.sub(r"<link\b([^>]*?)>", inline_style, html, flags=re.I)

          payload = json.dumps(files, separators=(",", ":"))
          loader = r"""
          <script>
          (() => {
            const files = __EMBEDDED_FILES__;
            const originalFetch = window.fetch.bind(window);
            const originalXhrOpen = XMLHttpRequest.prototype.open;
            const resolve = value => {
              try {
                const u = new URL(typeof value === "string" ? value : value.url, document.baseURI);
                if (u.protocol === "data:" || u.protocol === "blob:" || u.protocol === "javascript:") return null;
                let p = decodeURIComponent(u.pathname).replace(/^\/+/, "");
                if (files[p]) return files[p];
                p = p.replace(/^\.\//, "");
                if (files[p]) return files[p];
                const suffix = Object.keys(files).find(k => p.endsWith("/" + k));
                return suffix ? files[suffix] : null;
              } catch (_) { return null; }
            };
            window.fetch = (input, init) => {
              const data = resolve(input);
              return data ? originalFetch(data, init) : originalFetch(input, init);
            };
            XMLHttpRequest.prototype.open = function(method, url, ...rest) {
              return originalXhrOpen.call(this, method, resolve(url) || url, ...rest);
            };
            const patchSrc = (proto, property) => {
              if (!proto) return;
              const d = Object.getOwnPropertyDescriptor(proto, property);
              if (!d || !d.set || !d.get || !d.configurable) return;
              Object.defineProperty(proto, property, {
                configurable: true, enumerable: d.enumerable, get: d.get,
                set(value) { d.set.call(this, resolve(value) || value); }
              });
            };
            patchSrc(HTMLImageElement.prototype, "src");
            patchSrc(HTMLMediaElement.prototype, "src");
            patchSrc(HTMLScriptElement.prototype, "src");
            patchSrc(HTMLSourceElement.prototype, "src");
            patchSrc(HTMLLinkElement.prototype, "href");
            window.__PSYCH_ENGINE_SINGLE_HTML__ = true;
          })();
          </script>
          """.replace("__EMBEDDED_FILES__", payload)
          html = re.sub(r"</head\s*>", lambda m: loader + m.group(0), html, count=1, flags=re.I)
          if "__PSYCH_ENGINE_SINGLE_HTML__" not in html:
              html = loader + html
          output.write_text(html, encoding="utf-8")
          print(f"Created single HTML: {output.stat().st_size:,} bytes; embedded {len(files)} runtime files.")
          PY
          cat > "$GITHUB_WORKSPACE/release/README-release.txt" <<'EOF'
          Experimental Psych Engine 0.7.3 single-file HTML5 build.
          Runtime files are embedded into PsychEngineWebPort.html.
          This experimental build has not yet had browser gameplay or mod support verified.
          EOF

      - name: Upload build files as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngineWebPort-HTML5
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with HTML build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-build-${{ github.run_number }}
          name: Psych Engine Web Port — HTML build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            release/PsychEngineWebPort.html
            release/README-release.txt
